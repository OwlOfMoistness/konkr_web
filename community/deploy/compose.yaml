# LOCAL ONLY. The application listens inside its container; only host loopback is published.
# https://docs.docker.com/compose/how-tos/startup-order/
# https://docs.docker.com/reference/compose-file/services/
name: konkr-community-local
services:
  db:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      # Use a generated hexadecimal value so DATABASE_URL needs no URL escaping.
      POSTGRES_PASSWORD: ${COMMUNITY_DATABASE_PASSWORD:?Set a random hexadecimal database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U community -d community']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s
    # No database port is published to the host.

  app:
    image: konkr-community-local:development
    build:
      context: ../..
      dockerfile: community/deploy/Dockerfile
    init: true
    user: '1000:1000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://community:${COMMUNITY_DATABASE_PASSWORD:?Set a random hexadecimal database password}@db:5432/community
      COMMUNITY_ORIGIN: http://127.0.0.1:8080
      COMMUNITY_HOST: 0.0.0.0
      COMMUNITY_LOCAL_CONTAINER: '1'
      COMMUNITY_DATA_DIR: /app/community/.data
      COMMUNITY_CSRF_SECRET: ${COMMUNITY_CSRF_SECRET:?Set a random secret of at least 32 characters}
      COMMUNITY_DEV_CURATOR_ID: ${COMMUNITY_DEV_CURATOR_ID:-local-curator}
      COMMUNITY_DEV_CURATOR_KEY: ${COMMUNITY_DEV_CURATOR_KEY:?Set a random local curator key of at least 32 characters}
      COMMUNITY_CUSTOM_MAPS: ${COMMUNITY_CUSTOM_MAPS:-0}
      COMMUNITY_SUBMISSIONS: ${COMMUNITY_SUBMISSIONS:-0}
      COMMUNITY_VERIFIED_RESULTS: ${COMMUNITY_VERIFIED_RESULTS:-0}
      PORT: '8080'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - objects:/app/community/.data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=536870912,uid=1000,gid=1000
      - /app/community/.runtime:rw,nosuid,nodev,size=134217728,uid=1000,gid=1000
      - /app/community/.web:rw,nosuid,nodev,size=16777216,uid=1000,gid=1000
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Local ceilings, not production sizing or a measured throughput guarantee.
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 210s

volumes:
  database:
  objects:

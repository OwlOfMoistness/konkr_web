name: Community checks
'on':
  pull_request:
    paths: ['community/**', 'community maps/**', '_site/releases/2.35.30/**', '.github/workflows/**', 'compose.yaml']
  # Tests run locally via npm run check:release; CI only checks the build.
  workflow_dispatch:
  workflow_call:
permissions: {}
concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: community/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run build
      - name: Build static catalogue
        run: npm run build:static
      - name: Verify original release files remain untouched
        run: git diff --exit-code -- ../_site/releases/2.35.30 ../releases
